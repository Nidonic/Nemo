[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nemo-cloud"
version = "0.1.0"
description = "Nemo relay: accounts, one-time-code sign-in, a metered model proxy, the multi-device hub and conversation sync."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "cryptography>=42",
  "pydantic>=2.7",
]

[project.scripts]
nemo-cloud = "nemo_cloud.service:main"

[tool.hatch.build.targets.wheel]
packages = ["nemo_cloud"]
